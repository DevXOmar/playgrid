services:
  postgres:
    image: postgres:16-alpine
    container_name: playgrid-postgres
    environment:
      POSTGRES_USER: playgrid
      POSTGRES_PASSWORD: playgrid
      POSTGRES_DB: playgrid
    ports:
      # 5432 is often occupied by local macOS Postgres. Use a deterministic app port.
      - "15432:5432"
    volumes:
      - playgrid-postgres-data-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playgrid -d playgrid"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: playgrid-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  playgrid-postgres-data-v2:
